baseURL = "https://nguyencongthanh.io.vn/"
title = "Nguyễn Công Thành"
theme = "LoveIt"

defaultContentLanguage = "vi"
defaultContentLanguageInSubdir = false
enableRobotsTXT = true
enableEmoji = true
removePathAccents = true
capitalizeListTitles = false

[taxonomies]
  category = "categories"
  tag = "tags"
  series = "series"

[pagination]
  pagerSize = 10

[params]
  defaultTheme = "auto"
  dateFormat = "2006-01-02"
  [params.author]
    name = "Nguyễn Công Thành"
    link = "https://nguyencongthanh.io.vn/"
  # Code blocks are always expanded; the collapse toggle is hidden in _custom.scss
  [params.page.code]
    copy = true
    maxShownLines = 100000
  [params.header.title]
    name = "NCT Blog"
  [params.app]
    title = "NCT Blog"
  [params.home.profile]
    enable = true
    avatarURL = "https://github.com/nguyen-cong-thanh.png"
    social = true
  [params.home.posts]
    enable = true
  # Shown on the home page profile
  [params.social]
    GitHub = "nguyen-cong-thanh"
    Facebook = "thanhnc.se"
    Email = "thanhnc.se@gmail.com"
    RSS = true
    [params.social.TikTok]
      url = "https://www.tiktok.com/@nguyencongthanh.io.vn"
  [params.footer]
    since = 2026

[markup]
  [markup.highlight]
    codeFences = true
    noClasses = false
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 6

[languages]
  [languages.vi]
    weight = 1
    locale = "vi"
    label = "Tiếng Việt"
    title = "Nguyễn Công Thành"
    [languages.vi.params]
      description = "Blog cá nhân của Nguyễn Công Thành"
      [languages.vi.params.home.profile]
        subtitle = "Software engineer. Ghi chép về lập trình và những gì mình học được."
    [[languages.vi.menu.main]]
      weight = 1
      identifier = "posts"
      name = "Bài viết"
      url = "/posts/"
    [[languages.vi.menu.main]]
      weight = 2
      identifier = "tags"
      name = "Thẻ"
      url = "/tags/"
    [[languages.vi.menu.main]]
      weight = 3
      identifier = "series"
      name = "Series"
      url = "/series/"
    [[languages.vi.menu.main]]
      weight = 4
      identifier = "about"
      name = "Giới thiệu"
      url = "/about/"

  [languages.en]
    weight = 2
    locale = "en"
    label = "English"
    title = "Nguyen Cong Thanh"
    [languages.en.params]
      description = "Personal blog of Nguyen Cong Thanh"
      [languages.en.params.home.profile]
        subtitle = "Software engineer. Notes on programming and what I learn along the way."
    [[languages.en.menu.main]]
      weight = 1
      identifier = "posts"
      name = "Posts"
      url = "/posts/"
    [[languages.en.menu.main]]
      weight = 2
      identifier = "tags"
      name = "Tags"
      url = "/tags/"
    [[languages.en.menu.main]]
      weight = 3
      identifier = "series"
      name = "Series"
      url = "/series/"
    [[languages.en.menu.main]]
      weight = 4
      identifier = "about"
      name = "About"
      url = "/about/"
